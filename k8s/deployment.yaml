apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-gitops-app
  labels:
    app: self-healing-gitops-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: self-healing-gitops-app
  template:
    metadata:
      labels:
        app: self-healing-gitops-app
    spec:
      containers:
        - name: app
          image: self-healing-gitops-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
