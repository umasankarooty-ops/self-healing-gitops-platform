name: Self-Healing GitOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run application tests
        working-directory: app
        run: npm test

      - name: Build Docker image
        run: docker build -t self-healing-gitops-app:${{ github.sha }} ./app
